[project]
name = "smolvla-icra"
version = "0.1.0"
description = "SmolVLA policy server for ICRA 2026 VLA Workshop Competition"
readme = "README.md"
requires-python = ">=3.11.0, <3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.22.4,<2.0.0",
    "opencv-python>=4.10.0.84",
    "pillow>=11.0.0",
    "policy-client",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.45.0",
    "lerobot",
    "websockets>=12.0",
]

[tool.uv]
override-dependencies = []

[tool.uv.sources]
policy-client = { workspace = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
